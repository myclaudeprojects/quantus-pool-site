services:
  - type: web
    name: quantus-pool-site
    runtime: node
    plan: starter
    # Pin Node 20 — better-sqlite3@11 fails to compile on Render's default Node 26
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.19.2"
      - key: NODE_ENV
        value: production
      - key: PRE_TOKEN_OPEN_DOWNLOAD
        value: "true"
      - key: CLAIMS_OPEN
        value: "false"
      - key: TOKEN_ADDRESS
        value: ""
      - key: ARGUS_TOKEN_URL
        value: ""
      - key: MIN_HOLD
        value: "1"
      - key: CONNECTED_MULTIPLIER
        value: "1.5"
      - key: CONNECTED_WINDOW_MINUTES
        value: "15"
      - key: STUB_TOKEN_BALANCE
        value: "1"
      - key: DEMO_POOL_ACCRUAL_QTC
        value: "10"
      - key: SEED_OPERATOR_MINER
        value: "true"
      - key: SEED_OPERATOR_HASHRATE
        value: "125000000"
      - key: SEED_OPERATOR_LABEL
        value: operator-rig
      - key: SEED_OPERATOR_MINER_ID
        value: operator-seed-001
      - key: SEED_OPERATOR_TOUCH_MS
        value: "60000"
      - key: COINGECKO_ID
        value: quantus
      - key: COINGECKO_URL
        value: https://www.coingecko.com/en/coins/quantus
      - key: PRICE_CACHE_SECONDS
        value: "60"
      - key: QUANTUS_GRAPHQL_URL
        value: https://sub2.quantus.com/v1/graphql
      - key: QUANTUS_POLL_MS
        value: "4000"
      - key: OPERATOR_WORMHOLE
        value: qzmFDWnWRLygXLQMFU5GrFohBQe4gtFSp5Q45G3tXgn3P9WsQ
      - key: DOWNLOAD_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: ./data/pool.sqlite
    disk:
      name: quantus-pool-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
